[project]
name = "jelly-alert"
version = "0.2.0"
description = "Prototype jellyfish encounter forecast for Danish inner waters (DTU 25352)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "requests>=2.31",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "xarray>=2024.3",
  "netcdf4>=1.6",
  "h5netcdf>=1.3",
  "dask>=2024.3",
  "scikit-learn>=1.4",
  "elapid>=1.0.4",
  "matplotlib>=3.8",
  "copernicusmarine>=2.0",
  "cdsapi>=0.7.4",
]

[tool.uv]
package = false
